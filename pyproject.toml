[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-player-models"
version = "1.0.1"
description = "Endstone plugin that captures player skins and creates NPC entities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ninjo" }
]
dependencies = [
    "endstone>=0.11.8,<0.12",
    "numpy",
    "Pillow",
]

[project.entry-points."endstone"]
player_models = "endstone_player_models:PlayerModelsPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_player_models"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/endstone_player_models/**/*",
]
